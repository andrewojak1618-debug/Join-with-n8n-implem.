<section class="board-content" aria-labelledby="boardTitle">
  <div class="board-header">
    <h1 id="boardTitle">Board</h1>
    <div class="board-header__right">
      <div class="board-search">
        <input type="text" id="boardSearchInput" placeholder="Find Task" aria-label="Find Task" />
        <button type="button" class="board-search__btn" aria-label="Search">
          <span class="board-search__icon" aria-hidden="true">
            <img class="board-search__icon-default" src="./components/assets/img/icons/search-default.svg" alt="" />
            <img class="board-search__icon-click" src="./components/assets/img/icons/search-click.svg" alt="" />
          </span>
        </button>
      </div>
      <a class="board-add-task" href="./addTask.html?from=board" data-page="add-task" data-from="board"
        aria-label="Add task">
        <span class="board-add-task__label">Add task</span>
        <img src="./components/assets/img/icons/add.svg" alt="" aria-hidden="true" />
      </a>
    </div>
  </div>

  <div class="board-columns" aria-label="Saved tasks">
    <section class="board-column" aria-labelledby="boardTriageTitle">
      <div class="board-column__header">
        <h2 id="boardTriageTitle">Triage</h2>
        <a class="board-column__add" href="./addTask.html?from=board" data-page="add-task" data-from="board"
          aria-label="Add task to Triage">+</a>
      </div>
      <div class="board-task-list" data-board-status="triage"></div>
    </section>

    <section class="board-column" aria-labelledby="boardTodoTitle">
      <div class="board-column__header">
        <h2 id="boardTodoTitle">To do</h2>
        <a class="board-column__add" href="./addTask.html?from=board" data-page="add-task" data-from="board"
          aria-label="Add task to Triage">+</a>
      </div>
      <div class="board-task-list" data-board-status="todo"></div>
    </section>

    <section class="board-column" aria-labelledby="boardProgressTitle">
      <div class="board-column__header">
        <h2 id="boardProgressTitle">In progress</h2>
        <a class="board-column__add" href="./addTask.html?from=board" data-page="add-task" data-from="board" aria-label="Add task to Triage">+</a>
      </div>
      <div class="board-task-list" data-board-status="in-progress"></div>
    </section>

    <section class="board-column" aria-labelledby="boardFeedbackTitle">
      <div class="board-column__header">
        <h2 id="boardFeedbackTitle">Await feedback</h2>
        <a class="board-column__add" href="./addTask.html?from=board" data-page="add-task" data-from="board" aria-label="Add task to Triage">+</a>
      </div>
      <div class="board-task-list" data-board-status="feedback"></div>
    </section>

    <section class="board-column" aria-labelledby="boardDoneTitle">
      <div class="board-column__header">
        <h2 id="boardDoneTitle">Done</h2>
      </div>
      <div class="board-task-list" data-board-status="done"></div>
    </section>
  </div>
  <p class="board-search-no-results" id="boardSearchNoResults" role="status" aria-live="polite" hidden>
    No matching tasks found.
  </p>
  <div data-include="./components/html/organisms/boardDetailDialog.html"></div>
  <div data-include="./components/html/organisms/addTaskDialog.html"></div>
</section>
<p class="board-toast" id="boardToast" role="status" aria-live="polite" hidden></p>

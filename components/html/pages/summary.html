<section class="summary-content" aria-labelledby="summaryTitle">
  <h1 id="summaryTitle" class="summary-title"><span id="summaryTitleTime"></span> <strong id="summaryTitleName"></strong></h1>
  <p id="summaryLoadError" role="alert" hidden></p>

  <div class="summary-dashboard">
    <section class="summary-metrics" aria-label="Task overview">
      <div class="summary-row summary-row--top">
        <a class="summary-card summary-card--urgent" href="./board.html" data-page="board">
          <div class="summary-stat">
            <div class="summary-card__main">
              <span class="summary-card__icon" aria-hidden="true">
                <img src="./components/assets/img/icons/summary-urgent.svg" alt="" />
              </span>
              <strong id="summaryUrgentCount">0</strong>
            </div>
            <span>Tasks Urgent</span>
          </div>
          <div class="summary-deadline">
            <strong id="summaryDeadlineDate">No upcoming deadline</strong>
            <span>Upcoming Deadline</span>
          </div>
        </a>
        <a class="summary-card summary-card--email" href="./board.html" data-page="board">
          <div class="summary-email-count">
            <span class="summary-email-icon" aria-hidden="true"></span>
            <strong id="summaryEmailCount">0</strong>
          </div>
          <span>Email Requests</span>
        </a>
        <a class="summary-card summary-card--count" href="./board.html" data-page="board">
          <div class="summary-stat">
            <div class="summary-card__main">
              <span class="summary-card__icon" aria-hidden="true">
                <img src="./components/assets/img/icons/summary-board.svg" alt="" />
              </span>
              <strong id="summaryBoardCount">0</strong>
            </div>
            <span>Task in Board</span>
          </div>
        </a>
      </div>
      <div class="summary-row summary-row--bottom">
        <a class="summary-card summary-card--small summary-card--todo" href="./board.html" data-page="board">
          <div class="summary-stat">
            <div class="summary-card__main">
              <span class="summary-card__icon" aria-hidden="true">
                <img src="./components/assets/img/icons/summary-todo.svg" alt="" />
              </span>
              <strong id="summaryTodoCount">0</strong>
            </div>
            <span>Tasks To-do</span>
          </div>
        </a>
        <a class="summary-card summary-card--count" href="./board.html" data-page="board">
          <div class="summary-stat">
            <div class="summary-card__main">
              <span class="summary-card__icon" aria-hidden="true">
                <img src="./components/assets/img/icons/summary-progress.svg" alt="" />
              </span>
              <strong id="summaryProgressCount">0</strong>
            </div>
            <span>Task in Progress</span>
          </div>
        </a>
        <a class="summary-card summary-card--count" href="./board.html" data-page="board">
          <div class="summary-stat">
            <div class="summary-card__main">
              <span class="summary-card__icon" aria-hidden="true">
                <img src="./components/assets/img/icons/summary-feedback.svg" alt="" />
              </span>
              <strong id="summaryFeedbackCount">0</strong>
            </div>
            <span>Awaiting Feedback</span>
          </div>
        </a>
        <a class="summary-card summary-card--small" href="./board.html" data-page="board">
          <div class="summary-stat">
            <div class="summary-card__main">
              <span class="summary-card__icon" aria-hidden="true">
                <img src="./components/assets/img/icons/summary-done.svg" alt="" />
              </span>
              <strong id="summaryDoneCount">0</strong>
            </div>
            <span>Tasks Done</span>
          </div>
        </a>
      </div>
    </section>

    <div class="summary-greeting" aria-hidden="true">
      <p id="summaryGreetingTime"></p>
      <h2 id="summaryGreeting"></h2>
    </div>
  </div>
</section>
